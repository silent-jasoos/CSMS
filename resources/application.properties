# ================================================
# CYBERSHIELD CSMS - APPLICATION PROPERTIES
# ================================================

# ------------------------------------------------
# SERVER CONFIGURATION
# Controls which port your app runs on
# Access your app at: http://localhost:8080
# ------------------------------------------------
server.port=8080

# ------------------------------------------------
# MYSQL DATABASE CONFIGURATION
# Tells Spring Boot where your database is
# and how to connect to it
# ------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/cybershield_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Velvet-Starlight-9-Pancakes
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------
# JPA / HIBERNATE CONFIGURATION
# Controls how Spring Boot talks to the database
# ddl-auto=update \u2192 automatically creates/updates
# tables based on your Java models
# show-sql=true \u2192 prints SQL queries in console
# ------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ------------------------------------------------
# THYMELEAF CONFIGURATION
# Thymeleaf is your frontend template engine
# It connects your Java code with HTML pages
# cache=false \u2192 shows changes instantly without restart
# prefix \u2192 where your HTML files are located
# suffix \u2192 file extension of your HTML files
# ------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ------------------------------------------------
# JWT CONFIGURATION
# JWT = JSON Web Token
# Used for user login and authentication
# secret \u2192 secret key to sign tokens
# expiration \u2192 how long token lasts (86400000ms = 24 hours)
# ------------------------------------------------
jwt.secret=CyberShieldSecretKey2024VeryLongSecretKeyForHMACSHA512Algorithm
jwt.expiration=86400000

# ------------------------------------------------
# LOGGING CONFIGURATION
# Controls what gets printed in your console
# DEBUG \u2192 prints everything (good for development)
# Change to INFO or ERROR in production
# ------------------------------------------------
logging.level.com.cybershield=DEBUG
logging.level.org.springframework.security=DEBUG

# ------------------------------------------------
# FILE UPLOAD CONFIGURATION
# Controls maximum file size users can upload
# max-file-size=10MB \u2192 maximum single file size
# ------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB